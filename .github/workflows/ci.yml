name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gates:
    name: 三道闸 (lint / test / build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 检查闸
        run: pnpm lint

      - name: 测试闸
        run: pnpm test

      - name: 构建闸
        run: pnpm build
