name: Standalone Docker Image Gate

# Code lint/unit/build live in quality.yml (Node 22 + pnpm 10.20.0).
# This workflow separately checks the deployable multi-stage production image.
on:
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - compose.prod.yml
      - compose.staging.yml
      - package.json
      - pnpm-lock.yaml
      - 'server/**'
      - 'src/**'
      - 'index.html'
      - 'vite.config.ts'
      - 'tsconfig*.json'
      - '.github/workflows/ci.yml'
      - 'scripts/neon-schema.sql'
      - 'scripts/neon-migrations.sql'
      - 'scripts/start-prod.mjs'
      - 'scripts/staging-*.mjs'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  container:
    name: 生产镜像和 Compose 检查
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: 校验 Compose 配置（不连接生产数据库）
        env:
          NEON_DSN: postgresql://not-used.invalid/ci
        run: docker compose -f compose.prod.yml config --quiet
      - name: 验证预发布隔离配置（模板凭据，绝不连接数据库）
        env:
          STAGING_NEON_DSN: postgresql://not-used.invalid/staging
          STAGING_SCHEMA: staging_ci_preview
        run: |
          node scripts/staging-preflight.mjs
          docker compose -f compose.staging.yml config --quiet
      - uses: docker/setup-buildx-action@v3
      - name: 构建生产镜像（不推送、不注入任何数据库凭据）
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: suiyuan:ci
      - name: 核验镜像运行时文件、依赖和持久目录（无需数据库连接）
        run: |
          docker run --rm --entrypoint node suiyuan:ci --input-type=module -e "import fs from 'node:fs'; const paths=['dist/index.html','server/neon-gateway.mjs','server/client-ip.mjs','scripts/start-prod.mjs','scripts/neon-schema.sql','scripts/neon-migrations.sql']; for (const p of paths) { if (!fs.existsSync(p)) throw new Error('Missing runtime asset: '+p) }; fs.accessSync('/var/lib/suiyuan/uploads',fs.constants.W_OK); await import('pg'); await import('bcryptjs'); console.log('Standalone production runtime image verified')"
      - name: 记录待部署镜像标识
        run: docker image inspect suiyuan:ci --format '{{.Id}}'
