name: Full-stack Quality Gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Unit regression
        run: pnpm test
      - name: Build + typecheck
        run: pnpm build
      - name: Standalone platform independence check
        run: pnpm standalone:check
      - name: Install Chromium for mobile synthetic regression
        run: pnpm exec playwright install --with-deps chromium
      - name: Mobile UX browser regression (mocked API, no Neon credentials)
        run: pnpm mobile:check
      - name: Build Vercel static frontend and validate split routing without calling a backend
        env:
          SUIYUAN_DEPLOY_MODE: staging
          SUIYUAN_BACKEND_ORIGIN: https://suiyuan-staging-ci.onrender.com
          VERCEL_ENV: preview
        run: |
          node scripts/vercel-build.mjs
          pnpm vercel:check
          test -f vercel.ts && test ! -f vercel.mjs
      - name: Gateway syntax
        run: node --check server/neon-gateway.mjs
      - name: Discover Playwright tests without connecting to Neon
        run: pnpm exec playwright test --list
